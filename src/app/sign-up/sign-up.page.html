<ion-content [fullscreen]="true" class="flex items-center justify-center min-h-screen bg-gray-900 text-white">
  <div class="w-full max-w-md bg-gray-800 shadow-lg rounded-lg p-6">
    <header class="bg-black p-4 text-center rounded-t-lg">
      <h1 class="text-xl font-bold">Sign Up</h1>
    </header>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="mt-6 space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium">Email address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required #emailInput="ngModel"
          class="w-full p-2 border rounded-lg text-black focus:ring-2 focus:ring-blue-500">
        <div *ngIf="emailInput.invalid && emailInput.touched" class="text-red-500 text-sm mt-1">Please enter a valid email address.</div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required #passwordInput="ngModel"
          class="w-full p-2 border rounded-lg text-black focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit" [disabled]="registerForm.invalid"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg">Crear Cuenta</button>
    </form>

    <div class="flex justify-center mt-4">
      <button (click)="onSignUp()"
        class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2 rounded-lg">Go to Login</button>
    </div>
  </div>
</ion-content>
